<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mother's Day Coupons ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #ffe3ec, #fff6f8);
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 500px;
    width: 100%;
    padding: 20px;
  }

  .hero {
    text-align: center;
  }

  .hero h1 {
    font-family: 'Pacifico', cursive;
    color: #ff4f87;
    font-size: 2.2rem;
  }

  .coupon-grid {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 20px;
  }

  .coupon {
    perspective: 1000px;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 140px;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }

  .coupon.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    backface-visibility: hidden;
    box-shadow: 0 8px 20px rgba(255, 105, 135, 0.15);
    padding: 10px;
    text-align: center;
  }

  .card-front {
    background: white;
  }

  .card-front h2 {
    color: #ff4f87;
    margin: 0;
  }

  .card-back {
    background: #ff4f87;
    color: white;
    transform: rotateY(180deg);
  }

  button {
    margin-top: 10px;
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #ff4f87;
    font-weight: bold;
    cursor: pointer;
  }

  button.used {
    background: #ccc;
    color: white;
  }
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>Happy Mother's Day ❤️</h1>
    <p>Tap flip, then redeem your coupons</p>
  </div>

  <div class="coupon-grid">

    <div class="coupon">
      <div class="card-inner">
        <div class="card-front">
          <h2>🍳 Breakfast in Bed</h2>
          <button class="flip">Flip</button>
        </div>
        <div class="card-back">
          Homemade breakfast made with love ❤️
          <button class="redeem">Redeem</button>
        </div>
      </div>
    </div>

    <div class="coupon">
      <div class="card-inner">
        <div class="card-front">
          <h2>🧼 Chore-Free Day</h2>
          <button class="flip">Flip</button>
        </div>
        <div class="card-back">
          Relax all day — no chores ❤️
          <button class="redeem">Redeem</button>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- MUSIC -->
<audio id="bg-music" loop>
  <source src="music/song.mp3" type="audio/mpeg">
</audio>

<!-- CONFETTI LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  const music = document.getElementById("bg-music");

  // start music after first tap (browser rule)
  document.addEventListener("click", () => {
    music.play().catch(() => {});
  }, { once: true });

  // FLIP
  document.querySelectorAll(".flip").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const card = e.target.closest(".coupon");
      card.classList.toggle("flipped");
    });
  });

  // REDEEM + CONFETTI
  document.querySelectorAll(".redeem").forEach(btn => {
    btn.addEventListener("click", (e) => {

      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });

      btn.innerText = "Redeemed ❤️";
      btn.classList.add("used");
      btn.disabled = true;
    });
  });
</script>

</body>
</html>
